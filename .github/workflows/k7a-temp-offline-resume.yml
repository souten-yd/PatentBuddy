name: Temporary K7a offline-AI resume regression
on:
  push:
    branches: [feat/scoped-sources-storage-figures-k7a]
permissions:
  contents: read
jobs:
  manual-offline-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove temporary workflow from release-only source policy
        run: rm -f .github/workflows/k7a-temp-offline-resume.yml
      - name: Persistent deferred AI and host safety tests
        run: python -m unittest tests.test_addon_jobs tests.test_addon_host tests.test_patent_bulk_transfer -v
      - name: All repository tests and Linux integration
        run: bash scripts/verify-k6.sh
