name: K7a temporary manual bulk transfer checks
on:
  push:
    branches:
      - feat/scoped-sources-storage-figures-k7a
permissions:
  contents: read
jobs:
  bulk-and-k6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exclude temporary CI from repository release-only policy checks
        run: rm -f .github/workflows/k7a-temp-manual-transfer.yml
      - name: Manual transfer targeted tests (no real key, no external download)
        run: python -m unittest tests.test_patent_bulk_transfer tests.test_patent_bulk_catalog tests.test_source_connectivity -v
      - name: Entire K6 source/auth/safety and Linux package gate
        run: bash scripts/verify-k6.sh
  optional-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional local figure engine
        run: python -m pip install --disable-pip-version-check "PyMuPDF==1.26.7"
      - name: Optional isolated PDF figure crop regression
        run: python -m unittest tests.test_source_planner_storage_figures.PDFIsolatedWorkerTests -v
