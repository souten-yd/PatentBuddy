name: K7a source smoke (Draft-only)

on:
  push:
    branches:
      - feat/scoped-sources-storage-figures-k7a
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python targeted source / API tests (no network)
        run: |
          python -m unittest tests.test_source_connectivity tests.test_ipc_ai_selection tests.test_source_scope tests.test_source_planner_storage_figures tests.test_source_management_workspace -v
      - name: Existing local syntax, safety grep and whole repository tests
        run: bash scripts/verify.sh

  public-source-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: WIPO 2026.01 real section H title/XML + one OpenAlex public result
        continue-on-error: true
        run: |
          python - <<'PY'
          import urllib.request
          from qnaplibrary.official_ipc_titles import section_title_url, parse_titles
          from qnaplibrary.official_ipc import section_url, parse_valid_symbols
          from qnaplibrary.connectors import openalex_works

          # No credentials, no saving to user DB, no arbitrary targets.
          works = openalex_works("inverter", limit=1)
          if not works:
              raise AssertionError("OpenAlex returned no work")
          print("PASS: openalex public search 1 result", flush=True)
          for name, url, parser in (
              ("wipo_titles_H", section_title_url("H"), parse_titles),
              ("wipo_symbols_H", section_url("H"), parse_valid_symbols),
          ):
              print("fetch:", name, url, flush=True)
              with urllib.request.urlopen(url, timeout=40) as response:
                  raw = response.read(3 * 1024 * 1024 + 1)
              try:
                  result = parser(raw, "H")
                  print("PASS:", name, len(result), "records, bytes:", len(raw), flush=True)
              except Exception as error:
                  import xml.etree.ElementTree as ET
                  print("FAIL:", name, type(error).__name__, str(error), flush=True)
                  if name == "wipo_symbols_H":
                      root = ET.fromstring(raw)
                      print("WIPO XML root:", root.tag, root.attrib, flush=True)
                      nodes = list(root.iter())
                      print("WIPO XML first nodes:",
                            [(node.tag, dict(list(node.attrib.items())[:6]),
                              (node.text or "").strip()[:70]) for node in nodes[:10]], flush=True)
                  raise
          PY
