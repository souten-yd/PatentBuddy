name: K7a temporary real public patent sample probe
on:
  push:
    branches: [feat/scoped-sources-storage-figures-k7a]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch one specifically selected public patent and inspect metadata only
        run: |
          python - <<'PY'
          import urllib.request,urllib.robotparser,html.parser,json,time
          url='https://patents.google.com/patent/US11996769B2/en'
          robots=urllib.robotparser.RobotFileParser('https://patents.google.com/robots.txt')
          robots.read()
          print('robots_allowed:',robots.can_fetch('PatentBuddy-research/0.1',url))
          assert robots.can_fetch('PatentBuddy-research/0.1',url)
          req=urllib.request.Request(url,headers={'User-Agent':'PatentBuddy-research/0.1 public sample for academic review'})
          with urllib.request.urlopen(req,timeout=35) as resp:
              raw=resp.read(3*1024*1024+1)
              print('HTTP',resp.status,'bytes',len(raw))
          assert len(raw)<3*1024*1024
          class Meta(html.parser.HTMLParser):
              def __init__(self):super().__init__();self.meta={};self.items={}
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='meta':
                      k=d.get('name') or d.get('property')
                      if k:self.meta.setdefault(k,[]).append(d.get('content',''))
                  if 'itemprop' in d:self.items[d['itemprop']]=self.items.get(d['itemprop'],0)+1
          p=Meta();p.feed(raw.decode('utf-8','replace'))
          print('META_KEYS',json.dumps(sorted(p.meta),ensure_ascii=False))
          print('META_SELECTED',json.dumps({k:v[:4] for k,v in p.meta.items() if k.startswith('citation_') or k in ('DC.relation','DC.date')},ensure_ascii=False)[:10000])
          print('ITEMPROPS',json.dumps(p.items,ensure_ascii=False)[:6500])
          PY
