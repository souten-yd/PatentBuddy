name: K7a temporary public-patent fixture and K6 regression
on:
  push:
    branches: [feat/scoped-sources-storage-figures-k7a]
permissions:
  contents: read
jobs:
  pilot-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove test-only workflow in working tree for release-only rule
        run: rm -f .github/workflows/k7a-temp-patent-probe.yml
      - name: Real patent fixture integrity and offline parser tests
        run: |
          python -m unittest tests.test_patent_public_sample_report tests.test_addon_jobs -v
          python -m compileall -q scripts/patent_public_sample_report.py qnaplibrary
      - name: K6 entire repository safety and Linux artifact gate
        run: bash scripts/verify-k6.sh
